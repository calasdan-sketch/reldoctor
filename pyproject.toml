[build-system]
requires = ["setuptools>=77"]  # SPDX `license = "MIT"` needs PEP 639 support
build-backend = "setuptools.build_meta"

[project]
name = "reldoctor"
version = "0.3.0"
description = "Pre-upload doctor for Python releases: what PyPI will reject, what you are about to leak, wheels that lie about their contents, and what changed since the last release. Pure stdlib."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Calas Automations Inc." }]
keywords = ["packaging", "wheel", "sdist", "release", "metadata", "pypi", "qa", "secrets", "supply-chain"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Archiving :: Packaging",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/calasdan-sketch/reldoctor"
Issues = "https://github.com/calasdan-sketch/reldoctor/issues"
Source = "https://github.com/calasdan-sketch/reldoctor"
Changelog = "https://github.com/calasdan-sketch/reldoctor/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# Second opinions: when installed, reldoctor also asks the libraries PyPI itself uses.
oracle = ["packaging>=24.2"]
render = ["readme_renderer[md]>=43.0"]
all = ["packaging>=24.2", "readme_renderer[md]>=43.0"]

[project.scripts]
reldoctor = "reldoctor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
reldoctor = ["data/*.txt", "py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
filterwarnings = ["ignore:Duplicate name:UserWarning"]
